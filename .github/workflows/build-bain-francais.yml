name: Build Bain Francais APK

on:
  push:
    branches: [ build-bain-francais ]
    paths:
      - 'bain-francais-android/**'
      - '.github/workflows/build-bain-francais.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: bain-francais-android
        run: gradle --no-daemon assembleDebug
      - name: Copy final APK
        run: cp bain-francais-android/app/build/outputs/apk/debug/app-debug.apk Bain-de-Francais-APP-MADA-v1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bain-de-Francais-APP-MADA-v1.2
          path: Bain-de-Francais-APP-MADA-v1.2.apk
          if-no-files-found: error
